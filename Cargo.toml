[package]
name = "gasless-relayer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
solana-transaction = { version = "5.1", features = ["verify"] }
solana-message = "5.1"
solana-signature = "3"
solana-keypair = "4.0"
solana-signer = "4.0"
wincode = "0.6"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
solana-instruction = "4"
solana-hash = "4"
solana-pubkey = "4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# Wasm randomness backend (solana-ed25519 -> rand -> getrandom 0.4; 0.3 also in tree).
# Signing is deterministic; these only satisfy the link-time backend requirement.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
