name = "gasless-relayer"
main = "build/index.js"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

# Worker-level config (spec v2 §4.1). Per-project settings live in the D1 `projects` table.
# Secrets (.dev.vars locally, `wrangler secret put` when deployed — never here):
#   FEE_PAYER_<SLUG>   one Base58 keypair per project
#   RPC_URL_DEVNET / RPC_URL_MAINNET   keyed RPC (public RPCs return 403 to Workers)
[vars]
WALLET_BINDING = "wallets"
RPC_TIMEOUT_MS = "15000"
COOLDOWN_MS = "10000"
REJECT_COOLDOWN_MS = "3000"
REJECT_COOLDOWN_MAX_MS = "60000"
CLUSTER_RPM_DEVNET = "300"
CLUSTER_RPM_MAINNET = "300"
CLUSTER_HOP_TIMEOUT_MS = "2000"
REGISTRY_CACHE_MS = "60000"
REGISTRY_MAX_STALE_MS = "600000"
# Sapphire Devnet defaults are built in (iss "web3auth.io", citadel JWKS). Sapphire Mainnet has
# no default until verified (spec v2 spike 0.2): set both or mainnet projects answer 500.
# WEB3AUTH_MAINNET_ISSUER = ""
# WEB3AUTH_MAINNET_JWKS_URL = ""

[durable_objects]
bindings = [
  { name = "USER_CONTROLLER", class_name = "UserController" },
  { name = "PROJECT_THROTTLE", class_name = "ProjectThrottle" },
  { name = "CLUSTER_THROTTLE", class_name = "ClusterThrottle" },
]

# The v1 POC never reached a remote deploy (local `wrangler dev` only), so the first remote
# deploy starts from this single migration (spec V15); no unexported v1 classes are referenced.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserController", "ProjectThrottle", "ClusterThrottle"]

[[d1_databases]]
binding = "DB"
database_name = "gasless-relayer-audit"
database_id = "00000000-0000-0000-0000-000000000000" # local only — replace via runbook (`wrangler d1 create`)
migrations_dir = "migrations"
